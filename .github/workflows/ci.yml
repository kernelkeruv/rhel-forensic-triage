name: CI
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify documented repository scaffold
        run: |
          set -Eeuo pipefail
          test -f README.md
          test -f LICENSE
          test -f SECURITY.md
          grep -Fq "No executable triage implementation" README.md
